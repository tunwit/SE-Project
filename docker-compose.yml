services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      INTERNAL_BACKEND_URL: http://backend:3000
      BACKEND_URL: http://backend:3000
      API_PREFIX: /api/v1
      NEXT_PUBLIC_URL: http://localhost:9000
      BETTER_AUTH_URL: http://localhost:9000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me-32-chars}
      DATABASE_URL: postgresql://${DB_USERNAME:-helpdesk}:${DB_PASSWORD:-helpdesk}@postgres:5432/${DB_NAME:-helpdesk}?sslmode=disable
      BETTER_AUTH_DATABASE_URL: postgresql://${DB_USERNAME:-helpdesk}:${DB_PASSWORD:-helpdesk}@postgres:5432/${DB_NAME:-helpdesk}?sslmode=disable
      KU_ALL_LOGIN_ID: ${KU_ALL_LOGIN_ID:-}
      KU_ALL_LOGIN_SECRET: ${KU_ALL_LOGIN_SECRET:-}
      KU_AUTORIZE_URL: ${KU_AUTORIZE_URL:-https://sso-dev.ku.ac.th/realms/KU-Alllogin/protocol/openid-connect/auth}
      KU_TOKEN_URL: ${KU_TOKEN_URL:-https://sso-dev.ku.ac.th/realms/KU-Alllogin/protocol/openid-connect/token}
      KU_USERINFO_URL: ${KU_USERINFO_URL:-https://sso-dev.ku.ac.th/realms/KU-Alllogin/protocol/openid-connect/userinfo}
      KU_END_SESSION_URL: ${KU_END_SESSION_URL:-https://sso-dev.ku.ac.th/realms/KU-Alllogin/protocol/openid-connect/logout}
      NEXT_PUBLIC_IT_SUPPORT_EMAIL: ${NEXT_PUBLIC_IT_SUPPORT_EMAIL:-it.support@ku.th}
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    command:
      - /bin/sh
      - -c
      - |
        echo "Running database migrations..."
        migration
        echo "Seeding initial data..."
        seeder
        echo "Starting API..."
        exec api
    restart: unless-stopped
    environment:
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-9000}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-helpdesk}
      DB_USERNAME: ${DB_USERNAME:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Bangkok}
      DB_SSLMODE: disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ticket-images}
      MINIO_USE_SSL: "false"
      JWT_JWKS_URL: http://frontend:9000/api/auth/jwks
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-helpdesk}
      POSTGRES_USER: ${DB_USERNAME:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
      TZ: ${DB_TIMEZONE:-Asia/Bangkok}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-helpdesk} -d ${DB_NAME:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
  frontend-next:
